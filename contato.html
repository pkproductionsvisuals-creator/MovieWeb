<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieWeb - Contacto</title>
    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS INTEGRADOS (MovieWeb Dark Theme) --- */
        :root {
            --bg-dark: #0b1528;
            --card-bg: #111d35;
            --input-bg: #1b2a47;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Principal de Contacto */
        .contact-container {
            width: 100%;
            max-width: 900px;
            margin: 2rem;
            padding: 0 1rem;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .contact-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .contact-header span {
            color: var(--accent-blue);
        }

        .contact-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Layout em grelha para Formulário + Info */
        .contact-content {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .contact-content {
                grid-template-columns: 1fr;
            }
        }

        /* Formulário */
        .contact-form {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input,
        .form-group textarea {
            background-color: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn-submit {
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 0.95rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Cartão de Informações de Contacto */
        .contact-info {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .contact-info h3 {
            margin-top: 0;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-item i {
            font-size: 1.2rem;
            color: var(--accent-blue);
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 10px;
        }

        .info-item h4 {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .info-item p {
            margin: 0.2rem 0 0 0;
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        .social-links {
            margin-top: 1rem;
        }

        .social-links h4 {
            margin-bottom: 0.8rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .social-icons a {
            color: var(--text-primary);
            background-color: var(--input-bg);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-right: 0.6rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .social-icons a:hover {
            background-color: var(--accent-blue);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="contact-header">
            <h1>Entre em <span>Contacto</span></h1>
            <p>Tens alguma dúvida ou sugestão? Envia-nos uma mensagem.</p>
        </div>

        <div class="contact-content">
            <!-- Formulário -->
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="O teu nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="teu.email@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="assunto">Assunto</label>
                    <input type="text" id="assunto" name="assunto" placeholder="Assunto" required>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreve a tua mensagem..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Mensagem</button>
            </form>

            <!-- Informações / Lateral -->
            <div class="contact-info">
                <div>
                    <h3>Informações</h3>
                    
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <h4>E-mail</h4>
                            <p>suporte@movieweb.com</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div>
                            <h4>Localização</h4>
                            <p>Mindelo, São Vicente - CV</p>
                        </div>
                    </div>
                </div>

                <div class="social-links">
                    <h4>Redes Sociais</h4>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-github"></i></a>
                        <a href="#"><i class="fab fa-linkedin-in"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Mensagem enviada com sucesso!');
            e.target.reset();
        });
    </script>
</body>
</html>
