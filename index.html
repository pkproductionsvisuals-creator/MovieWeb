<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieWeb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--MENU CIRCULO-->
    <div class="menu-circle">
        <button id="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
            <span id="menu-icon">☰</span>
        </button>
    </div>

    <!-- MENU LATERAL -->
    <nav class="side-menu">

        <button class="nav-item" style="--i: 1">
            <span>⌂</span> ITEM 1
        </button>

        <button class="nav-item" style="--i: 2">
            <span>★</span> ITEM 2
        </button>

        <button class="nav-item" style="--i: 3">
            <span>✉</span> ITEM 3
        </button>

    </nav>


    <!-- CONTEÚDO -->
    <div class="page-container" id="page-container">
        <header>
            <input type="search" id="search" placeholder="Pesquisar filmes...">
        </header>

        <!-- Lista de filmes -->
        <main>
            <div id="movies"></div>
        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
